<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexChat Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <div class="brand-mark auth-brand-mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7.5A3.5 3.5 0 0 1 7.5 4h5A3.5 3.5 0 0 1 16 7.5v1.1l2.9-1.86a1.5 1.5 0 0 1 2.31 1.26v7.98a1.5 1.5 0 0 1-2.31 1.26L16 15.4v1.1a3.5 3.5 0 0 1-3.5 3.5h-5A3.5 3.5 0 0 1 4 16.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>NexChat</h1>
    <p class="subtitle center-text">Video calls &amp; chat, kept clean by AI</p>

    <section class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab" type="button" onclick="window.location.href='/login'">Sign In</button>
        <button class="auth-tab active" type="button">Create Account</button>
      </div>

      <div class="form-stack">
        <label for="name">Username</label>
        <input id="name" class="field-input" type="text" placeholder="shadow_coder">
        <small class="hint-text">Letters, numbers, and underscores only</small>

        <label for="email">Email</label>
        <input id="email" class="field-input" type="email" placeholder="you@example.com">

        <label for="password">Password</label>
        <div class="password-box">
          <input id="password" class="field-input" type="password" placeholder="Min. 6 characters">
          <button class="password-toggle" type="button" onclick="togglePassword('password', this)">Show</button>
        </div>

        <button class="primary-btn full-width" type="button" onclick="register()">Create Account</button>
        <p class="guardian-note">AI Guardian watches messages for risky language.</p>
        <p id="msg" class="status-text"></p>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
