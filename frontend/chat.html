<!DOCTYPE html>
<html>
<head>
<title>Study Room</title>

<link rel="stylesheet" href="style.css">

<style>

/* MAIN LAYOUT */
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: "Segoe UI", sans-serif;
}

/* VIDEO SECTION */
#videoSection {
  flex: 2;
  background: #020617;
  display: flex;
  flex-direction: column;
}

#videoSection h3 {
  text-align: center;
  color: white;
}

/* VIDEO GRID */
#videoGrid {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 10px;

  overflow: hidden; /* 🔥 FIX SCROLL */
}

/* VIDEO STYLE */
video {
  width: 300px;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
  background: black;
}

/* CONTROLS */
#controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
  background: #020617;
}

#controls button {
  padding: 10px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  color: white;
}

.leave-btn {
  background: #ef4444;
}

.normal-btn {
  background: #334155;
}

/* CHAT SECTION */
#chatSection {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #0f172a;
  color: white;
}

#chatSection h3 {
  text-align: center;
}

/* MESSAGES */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

/* MESSAGE BUBBLE */
.message {
  background: #1e293b;
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  max-width: 70%;
}

.message.me {
  background: #6366f1;
  margin-left: auto;
}

/* INPUT */
#chatInput {
  display: flex;
}

#chatInput input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
}

#chatInput button {
  padding: 10px;
  background: #6366f1;
  border: none;
  color: white;
  cursor: pointer;
}

/* TYPING */
#typing {
  font-size: 12px;
  padding-left: 10px;
  color: gray;
}

</style>

</head>

<body>

<!-- VIDEO SECTION -->
<div id="videoSection">

<h3>🎥 Video Room</h3>

<div id="videoGrid">
  <video id="localVideo" autoplay muted></video>
</div>

<div id="controls">
  <button class="normal-btn" onclick="toggleMute()">Mute</button>
  <button class="normal-btn" onclick="toggleCamera()">Camera</button>
  <button class="leave-btn" onclick="leaveRoom()">Leave</button>
</div>

</div>

<!-- CHAT SECTION -->
<div id="chatSection">

<h3>💬 Chat</h3>

<div id="messages"></div>

<div id="typing"></div>

<div id="chatInput">
  <input id="msgInput" placeholder="Type message..." />
  <button onclick="sendMessage()">Send</button>
</div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
