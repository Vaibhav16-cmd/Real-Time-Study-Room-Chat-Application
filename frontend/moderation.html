<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexChat Moderation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="moderation-body">
  <div class="app-shell light-shell">
    <header class="topbar light-topbar">
      <a class="brand-lockup light-brand" href="/rooms">
        <span class="brand-mark purple-brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7.5A3.5 3.5 0 0 1 7.5 4h5A3.5 3.5 0 0 1 16 7.5v1.1l2.9-1.86a1.5 1.5 0 0 1 2.31 1.26v7.98a1.5 1.5 0 0 1-2.31 1.26L16 15.4v1.1a3.5 3.5 0 0 1-3.5 3.5h-5A3.5 3.5 0 0 1 4 16.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>NexChat</span>
      </a>

      <nav class="light-nav">
        <a href="/rooms">Rooms</a>
        <a class="active" href="/moderation">Moderation</a>
      </nav>
    </header>

    <main class="moderation-page">
      <section class="moderation-header">
        <div class="moderation-icon">GUARD</div>
        <div>
          <h1>AI Guardian Dashboard</h1>
          <p>Review flagged content and monitor system health.</p>
        </div>
      </section>

      <section class="moderation-stats">
        <article class="stat-card">
          <span>Total Processed</span>
          <strong id="total">0</strong>
        </article>
        <article class="stat-card green-tone">
          <span>Approved</span>
          <strong id="approved">0</strong>
        </article>
        <article class="stat-card amber-tone">
          <span>Flagged</span>
          <strong id="flagged">0</strong>
        </article>
        <article class="stat-card red-tone">
          <span>Removed</span>
          <strong id="removed">0</strong>
        </article>
      </section>

      <section class="moderation-grid">
        <div>
          <div class="section-heading">
            <h2>Needs Review</h2>
            <span id="flaggedCountBadge" class="count-badge">0</span>
          </div>
          <div id="flaggedList" class="review-list"></div>
        </div>

        <aside>
          <div class="section-heading">
            <h2>Flag Categories</h2>
          </div>
          <div id="categoryList" class="category-list"></div>
        </aside>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
